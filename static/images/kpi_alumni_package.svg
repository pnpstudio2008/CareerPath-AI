<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadowGold" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle Glow -->
  <circle cx="32" cy="32" r="28" fill="#FFFBEB"/>
  <!-- Trophy / Package Base -->
  <circle cx="32" cy="32" r="22" fill="url(#goldGrad)" filter="url(#shadowGold)"/>
  <circle cx="32" cy="32" r="18" fill="url(#coinGrad)"/>
  <circle cx="32" cy="32" r="16" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- Rupee Symbol Symbol (Indian Currency ₹) -->
  <path d="M24 23H40" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M24 28H36" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M28 23V42" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M28 28C33 28 36 29 36 33C36 36 33 37 28 37L38 43" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
